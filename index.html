<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finding Our Voice at Mission High School</title>
<meta name="description" content="A student-founded program at Mission High School supporting newcomer students in learning English and navigating the U.S. education system."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;1,800&family=Barlow:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#F5C132;--brown-dark:#3D2B1A;--brown-mid:#7A4F2E;
  --parchment:#FDF6E3;--parchment2:#F7EDD4;--ink:#1A1A1A;--white:#fff;
}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--parchment);color:var(--ink);font-size:18px;line-height:1.6;overflow-x:hidden}

/* ── TRANSITIONS ── */
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.page-enter{animation:pageIn .15s ease forwards}

/* ── BUTTONS ── */
.btn-pill{display:inline-block;background:var(--gold);color:var(--brown-dark);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.1em;padding:.65rem 1.8rem;border-radius:999px;text-decoration:none;border:none;cursor:pointer;transition:background .2s,transform .15s;white-space:nowrap}
.btn-pill:hover{background:#e8b420;transform:translateY(-2px)}
.btn-pill--dark{background:var(--brown-dark);color:var(--gold)}
.btn-pill--dark:hover{background:#2a1d0e}
.btn-outline{display:inline-block;background:transparent;color:var(--white);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.1em;padding:.65rem 1.8rem;border-radius:999px;text-decoration:none;border:2px solid rgba(255,255,255,.5);transition:border-color .2s,background .2s;white-space:nowrap;cursor:pointer}
.btn-outline:hover{border-color:var(--white);background:rgba(255,255,255,.07)}
.btn-outline--brown{color:var(--brown-dark);border-color:rgba(61,43,26,.4)}
.btn-outline--brown:hover{border-color:var(--brown-dark);background:rgba(61,43,26,.07)}
.eyebrow{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.22em;margin-bottom:.8rem}

/* ── NAV ── */
.nav{position:sticky;top:0;z-index:200;background:var(--brown-dark);height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;box-shadow:0 2px 20px rgba(0,0,0,.35);transition:box-shadow .3s}
.nav__logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2rem;color:var(--gold);text-decoration:none;letter-spacing:.06em;text-transform:uppercase;line-height:1;cursor:pointer}
.nav__links{display:flex;gap:1.8rem;list-style:none;align-items:center}
.nav__links a{font-family:'Barlow',sans-serif;font-weight:600;font-size:.88rem;letter-spacing:.04em;color:rgba(255,255,255,.75);text-decoration:none;transition:color .2s;cursor:pointer;background:none;border:none;padding:0}
.nav__links a:hover,.nav__links a.active{color:var(--gold)}
.nav__right{display:flex;align-items:center;gap:.8rem}
.lang-toggle{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.85rem;letter-spacing:.1em;background:rgba(245,193,50,.15);color:var(--gold);border:1px solid rgba(245,193,50,.4);border-radius:999px;padding:.35rem .9rem;cursor:pointer;transition:background .2s;white-space:nowrap}
.lang-toggle:hover{background:rgba(245,193,50,.25)}
.nav__hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
.nav__hamburger span{display:block;width:26px;height:2px;background:var(--gold);border-radius:2px;transition:all .3s}
.nav__drawer{display:none;position:absolute;top:68px;left:0;right:0;background:var(--brown-dark);border-top:1px solid rgba(245,193,50,.18);padding:1.5rem 2rem;flex-direction:column;gap:1rem;z-index:199}
.nav__drawer.open{display:flex}
.nav__drawer a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em;color:var(--white);text-decoration:none;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.nav__drawer a:last-of-type{border-bottom:none}
.nav__drawer .lang-toggle{align-self:flex-start;margin-top:.5rem}

/* ── HERO ── */
.hero{background:var(--brown-dark);min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:5rem 2rem}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(245,193,50,.12) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.hero__arcs{position:absolute;inset:0;pointer-events:none;opacity:.05}
.hero__content{position:relative;z-index:2;max-width:960px;width:100%}
.hero__headline-wrap{position:relative;display:inline-block}
.hero__headline{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(5rem,18vw,15rem);line-height:.87;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:2rem}
.hero__headline .g{color:var(--gold);display:block}
.hero__headline .w{color:var(--white);display:block}
.hero__bubble{position:absolute;top:-28px;right:-65px;width:95px;pointer-events:none}
.hero__star{position:absolute;bottom:10px;left:-45px;width:56px;pointer-events:none;opacity:.8}
.hero__sub{color:rgba(255,255,255,.78);font-size:clamp(1rem,2vw,1.2rem);max-width:520px;margin:0 auto 2.8rem;line-height:1.55}
.hero__btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

/* ── IMPACT ── */
.impact{background:var(--parchment);padding:5.5rem 2rem;border-top:4px solid var(--brown-dark);border-bottom:4px solid var(--brown-dark)}
.impact__grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;text-align:center}
.impact__item{position:relative}
.impact__item+.impact__item::before{content:'';position:absolute;left:0;top:15%;bottom:15%;width:2px;background:repeating-linear-gradient(to bottom,var(--brown-mid) 0,var(--brown-mid) 5px,transparent 5px,transparent 10px)}
.impact__num{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(4rem,11vw,9rem);line-height:1;color:var(--gold);-webkit-text-stroke:3px var(--brown-dark)}
.impact__label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.1em;color:var(--brown-mid);margin-top:.4rem;display:block;line-height:1.35}
.impact__label small{display:block;font-size:.75rem;letter-spacing:.06em;opacity:.75;margin-top:.15rem}

/* ── MISSION ── */
.mission{background:var(--brown-dark);padding:7rem 2rem;text-align:center;position:relative;overflow:hidden}
.mission::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 80% 20%,rgba(245,193,50,.06) 0,transparent 50%),radial-gradient(circle at 20% 80%,rgba(245,193,50,.06) 0,transparent 50%);pointer-events:none}
.mission__inner{max-width:860px;margin:0 auto;position:relative;z-index:1}
.mission__text{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,4rem);line-height:1.08;color:var(--white);text-transform:uppercase}
.mission__highlight{color:var(--gold);position:relative;display:inline-block;white-space:nowrap}
.mission__highlight svg{position:absolute;bottom:-10px;left:-4px;width:calc(100% + 8px);height:16px;pointer-events:none}
.mission__pencil{position:absolute;bottom:2rem;right:3rem;width:56px;transform:rotate(18deg);opacity:.65;pointer-events:none}

/* ── SECTION HEADER ── */
.section-dark{background:var(--brown-dark);padding:6rem 2rem}
.section-light{background:var(--parchment);padding:6rem 2rem}
.section-light2{background:var(--parchment2);padding:6rem 2rem}
.section-hd{text-align:center;margin-bottom:3.5rem}
.section-hd .eyebrow{color:var(--gold)}
.section-hd__title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(2.8rem,7vw,6rem);line-height:.88;text-transform:uppercase;color:var(--white);display:inline-block}
.section-hd__title--dark{color:var(--brown-dark)}
.section-hd__wave{display:block;margin:.7rem auto 0;width:220px}
.section-hd--left{text-align:left}
.section-hd--left .section-hd__wave{margin:.6rem 0 0}

/* ── STORY ── */
.story__inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start}
.story__headline{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(2rem,4vw,3.2rem);line-height:.93;text-transform:uppercase;color:var(--brown-dark);margin-bottom:2rem}
.story__body p{font-size:1rem;color:var(--brown-mid);margin-bottom:1.1rem;line-height:1.75}
.story__body strong{color:var(--brown-dark)}
.story__founders{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.8rem}
.founder-chip{background:var(--gold);color:var(--brown-dark);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;padding:.3rem 1rem;border-radius:999px;cursor:pointer}
.founder-chip:hover{background:#e8b420}
.timeline{position:relative;padding-left:2.2rem}
.timeline::before{content:'';position:absolute;top:6px;bottom:6px;left:0;width:3px;background:repeating-linear-gradient(to bottom,var(--gold) 0,var(--gold) 8px,transparent 8px,transparent 16px)}
.timeline__item{position:relative;padding-bottom:2.8rem}
.timeline__item:last-child{padding-bottom:0}
.timeline__dot{position:absolute;left:-2.2rem;top:3px;width:20px;height:20px;background:var(--gold);border:3px solid var(--brown-dark);border-radius:50%;transform:translateX(-50%) translateX(1.5px)}
.timeline__year{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.6rem;color:var(--gold);line-height:1;display:block}
.timeline__title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--brown-dark);margin:.2rem 0 .35rem}
.timeline__desc{font-size:.9rem;color:var(--brown-mid);line-height:1.55}

/* ── VOICES ── */
.voices__grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem}
.q-card{background:rgba(255,255,255,.05);border:1px solid rgba(245,193,50,.22);border-radius:14px;padding:2rem 1.8rem;position:relative;transition:transform .2s,border-color .2s}
.q-card:hover{transform:translateY(-4px);border-color:rgba(245,193,50,.5)}
.q-card__mark{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:6rem;color:var(--gold);opacity:.22;line-height:1;position:absolute;top:.2rem;left:1.2rem}
.q-card__text{font-style:italic;font-size:1.05rem;color:var(--gold);line-height:1.65;position:relative;z-index:1;margin-top:1.8rem}
.q-card__footer{display:flex;align-items:center;gap:.8rem;margin-top:1.6rem}
.q-card__avatar{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--brown-dark);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.15rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q-card__name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.55)}

/* ── HOW IT WORKS ── */
.how__inner{max-width:1100px;margin:0 auto}
.how__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1.5rem;margin-top:3.5rem}
.how__card{background:var(--white);border-radius:14px;padding:2.2rem 2rem;border-top:5px solid var(--gold);box-shadow:0 6px 30px rgba(61,43,26,.07);transition:transform .2s,box-shadow .2s}
.how__card:hover{transform:translateY(-5px);box-shadow:0 12px 40px rgba(61,43,26,.12)}
.how__icon{width:54px;height:54px;margin-bottom:1.3rem}
.how__card-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2rem;text-transform:uppercase;color:var(--brown-dark);margin-bottom:.6rem;line-height:1}
.how__card-body{font-size:1rem;color:var(--brown-mid);line-height:1.65}

/* ── PARTNERS ── */
.partners__label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.25em;color:rgba(255,255,255,.35);margin-bottom:2.8rem;text-align:center}
.partners__row{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center}
.p-badge{background:rgba(255,255,255,.06);border:1px solid rgba(245,193,50,.28);border-radius:14px;padding:1.8rem 2.4rem;min-width:200px;display:flex;flex-direction:column;align-items:center;gap:.7rem;transition:border-color .2s,background .2s}
.p-badge:hover{border-color:var(--gold);background:rgba(245,193,50,.07)}
.p-badge__name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.25rem;text-transform:uppercase;color:var(--gold);letter-spacing:.04em}
.p-badge__sub{font-size:.8rem;color:rgba(255,255,255,.45);letter-spacing:.04em}

/* ── TEAM PAGE ── */
.team__intro{font-size:1.05rem;color:rgba(255,255,255,.72);max-width:620px;margin:1.5rem auto 0;text-align:center;line-height:1.65}
.team-grid{max-width:1100px;margin:3.5rem auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem}
.team-card{background:rgba(255,255,255,.05);border:1px solid rgba(245,193,50,.22);border-radius:14px;padding:2rem 1.8rem;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.team-card:hover{transform:translateY(-6px);border-color:var(--gold);background:rgba(245,193,50,.06)}
.team-card__avatar{width:80px;height:80px;border-radius:50%;background:var(--gold);color:var(--brown-dark);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.8rem;display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem}
.team-card__name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.8rem;text-transform:uppercase;color:var(--white);line-height:1;margin-bottom:.3rem}
.team-card__role{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:1rem}
.team-card__blurb{font-size:.9rem;color:rgba(255,255,255,.6);line-height:1.55;margin-bottom:1.4rem}
.team-card__btn{font-size:.85rem;padding:.5rem 1.4rem}

/* ── FOUNDER BIO PAGE ── */
.founder-hero{background:var(--brown-dark);padding:5rem 2rem 4rem;text-align:center;position:relative;overflow:hidden}
.founder-hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(245,193,50,.1) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.founder-hero__inner{position:relative;z-index:1}
.founder-hero__avatar{width:120px;height:120px;border-radius:50%;background:var(--gold);color:var(--brown-dark);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:3rem;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;border:4px solid rgba(255,255,255,.15)}
.founder-hero__name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(3.5rem,10vw,8rem);text-transform:uppercase;color:var(--gold);line-height:.9;margin-bottom:.6rem}
.founder-hero__role{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.6)}
.founder-body{background:var(--parchment);padding:5rem 2rem}
.founder-body__inner{max-width:780px;margin:0 auto}
.back-btn{display:inline-flex;align-items:center;gap:.4rem;margin-bottom:3rem;font-size:.9rem}
.founder-bios p{font-size:1.05rem;color:var(--brown-mid);line-height:1.8;margin-bottom:1.3rem}
.founder-bios strong{color:var(--brown-dark)}
.founder-quote{background:var(--brown-dark);border-radius:14px;padding:2.2rem 2.4rem;margin:2.5rem 0;position:relative}
.founder-quote::before{content:'\201C';font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:6rem;color:var(--gold);opacity:.2;position:absolute;top:.2rem;left:1.2rem;line-height:1}
.founder-quote__label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.4);margin-bottom:1rem}
.founder-quote__text{font-style:italic;font-size:1.2rem;color:var(--gold);line-height:1.6;position:relative;z-index:1}
.founder-contribs{margin-top:2.5rem}
.founder-contribs__title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.5rem;text-transform:uppercase;color:var(--brown-dark);margin-bottom:1.2rem}
.founder-contribs ul{list-style:none;padding:0}
.founder-contribs li{display:flex;align-items:flex-start;gap:.8rem;padding:.7rem 0;border-bottom:1px solid rgba(61,43,26,.1);font-size:1rem;color:var(--brown-mid);line-height:1.5}
.founder-contribs li:last-child{border-bottom:none}
.founder-contribs li::before{content:'';flex-shrink:0;width:9px;height:9px;background:var(--gold);border-radius:50%;margin-top:.45rem}

/* ── RESOURCES ── */
.resource-grid{max-width:1100px;margin:3rem auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
.resource-card{background:var(--white);border-radius:14px;padding:1.8rem;border-left:5px solid var(--gold);box-shadow:0 4px 20px rgba(61,43,26,.07);transition:transform .2s,box-shadow .2s}
.resource-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(61,43,26,.12)}
.resource-card__title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.5rem;text-transform:uppercase;color:var(--brown-dark);margin-bottom:.4rem;line-height:1}
.resource-card__body{font-size:.95rem;color:var(--brown-mid);line-height:1.6;margin-bottom:1.2rem}
.resource-card__link{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brown-dark);text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:1px;transition:color .2s}
.resource-card__link:hover{color:var(--brown-mid)}

/* ── GET INVOLVED / CTA ── */
.cta{background:var(--brown-dark);border-top:5px solid var(--gold);padding:7rem 2rem 5rem;text-align:center;position:relative;overflow:hidden}
.cta::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(245,193,50,.08) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.cta__inner{position:relative;z-index:1}
.cta__headline{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(3.5rem,12vw,10rem);text-transform:uppercase;color:var(--gold);line-height:.88;margin-bottom:1.2rem}
.cta__sub{color:rgba(255,255,255,.72);font-size:1.1rem;max-width:480px;margin:0 auto 3rem;line-height:1.55}
.cta__paths{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.cta__card{background:rgba(255,255,255,.06);border:1px solid rgba(245,193,50,.25);border-radius:16px;padding:2.2rem 2.5rem;min-width:230px;max-width:320px;text-align:center;transition:border-color .2s,background .2s}
.cta__card:hover{border-color:var(--gold);background:rgba(245,193,50,.06)}
.cta__card-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2.2rem;text-transform:uppercase;color:var(--white);margin-bottom:.5rem;line-height:1}
.cta__card-desc{font-size:.95rem;color:rgba(255,255,255,.6);margin-bottom:1.4rem;line-height:1.5}

/* ── FORM ── */
.form-wrap{max-width:640px;margin:4rem auto 0;background:rgba(255,255,255,.05);border:1px solid rgba(245,193,50,.2);border-radius:16px;padding:2.5rem}
.form-wrap h3{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2rem;text-transform:uppercase;color:var(--gold);margin-bottom:1.8rem;line-height:1}
.form-group{margin-bottom:1.3rem}
.form-group label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.6);margin-bottom:.4rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.07);border:1px solid rgba(245,193,50,.25);border-radius:8px;color:var(--white);font-family:'Barlow',sans-serif;font-size:1rem;transition:border-color .2s;appearance:none}
.form-group input::placeholder,.form-group textarea::placeholder{color:rgba(255,255,255,.3)}
.form-group select option{background:var(--brown-dark);color:var(--white)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--gold)}
.form-group textarea{min-height:110px;resize:vertical}
.form-confirm{display:none;padding:3rem 1rem;text-align:center}
.form-confirm p{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2rem;color:var(--gold);text-transform:uppercase;line-height:1.2}

/* ── FOOTER ── */

  gil_bio1:'Gil creció navegando dos mundos: el barrio de Mission District que llamaba hogar y el sistema escolar estadounidense que a menudo se sentía extraño. Como estudiante en Mission High, notó que los estudiantes recién llegados como él eran invisibles en el salón de clases, luchando con el inglés, sin saber cómo pedir ayuda.',

        <svg viewBox="0 0 44 44" fill="none" style="width:42px;margin:0 auto 1rem;display:block" aria-hidden="true"><path d="M22 40 L6 24 Q2 16 10 12 Q16 9 22 18 Q28 9 34 12 Q42 16 38 24Z" fill="rgba(245,193,50,0.2)" stroke="#F5C132" stroke-width="2" stroke-linejoin="round"/></svg>
        <h3 class="cta__card-title">${t('don_title')}</h3>
        <p class="cta__card-desc">${t('don_desc')}</p>
        <a href="mailto:info@findingourvoice.org?subject=I want to donate" class="btn-pill">${t('don_btn')}</a>
      </div>
    </div>
    <div class="form-wrap">
      <h3>${t('form_headline')}</h3>
      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="fc-name">${t('form_name')}</label>
          <input id="fc-name" type="text" name="name" required placeholder="${t('form_name')}"/>
        </div>
        <div class="form-group">
          <label for="fc-email">${t('form_email')}</label>
          <input id="fc-email" type="email" name="email" required placeholder="${t('form_email')}"/>
        </div>
        <div class="form-group">
          <label for="fc-intent">${t('form_intent')}</label>
          <select id="fc-intent" name="intent">
            <option value="volunteer">${t('form_opt1')}</option>
            <option value="donate">${t('form_opt2')}</option>
            <option value="partner">${t('form_opt3')}</option>
            <option value="learn">${t('form_opt4')}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fc-msg">${t('form_message')}</label>
          <textarea id="fc-msg" name="message" placeholder="${t('form_message')}"></textarea>
        </div>
        <button type="submit" class="btn-pill" style="width:100%;justify-content:center;padding:.85rem">${t('form_submit')}</button>
      </form>
      <div class="form-confirm" id="form-confirm">
        <p>${t('form_confirm')}</p>
      </div>
    </div>
  </div>
</section>`;
}

/* ── ROUTER ── */
const ROUTES={
  home:pageHome, about:pageAbout, team:pageTeam,
  voices:pageVoices, programs:pagePrograms, resources:pageResources,
  'get-involved':pageGetInvolved,
  gil:()=>pageFounder('gil'), yuli:()=>pageFounder('yuli'),
  emir:()=>pageFounder('emir'), darwing:()=>pageFounder('darwing')
};

function getRoute(){
  const h=location.hash.replace('#','').trim();
  return ROUTES[h]?h:'home';
}

function navigate(r){
  if(!ROUTES[r]) r='home';
  route=r;
  history.pushState(null,'',r==='home'?'#':'#'+r);
  renderSite();
  window.scrollTo({top:0,behavior:'instant'});
}

function renderSite(){
  const pageBuilder=ROUTES[route]||pageHome;
  document.getElementById('site').innerHTML=
    buildNav()+
    `<main class="page-enter">${pageBuilder()}</main>`+
    buildFooter();
  document.documentElement.lang=lang;
  // Scroll listener for nav shadow
  const nav=document.getElementById('navbar');
  const onScroll=()=>{nav&&(nav.style.boxShadow=window.scrollY>20?'0 4px 30px rgba(0,0,0,0.5)':'0 2px 20px rgba(0,0,0,0.35)')};
  window.removeEventListener('scroll',window._fovScroll||onScroll);
  window._fovScroll=onScroll;
  window.addEventListener('scroll',onScroll,{passive:true});
}

/* ── EVENTS (single delegation block) ── */
document.addEventListener('click',function(e){
  // Language toggle (desktop + mobile)
  if(e.target.closest('#lang-toggle')||e.target.closest('#lang-toggle-mobile')){
    lang=lang==='en'?'es':'en';
    localStorage.setItem('fov-lang',lang);
    renderSite();
    return;
  }
  // Hamburger
  const ham=e.target.closest('#hamburger');
  if(ham){
    const drawer=document.getElementById('drawer');
    if(drawer){const open=drawer.classList.toggle('open');ham.setAttribute('aria-expanded',open);}
    return;
  }
  // Close drawer on outside click
  const drawer=document.getElementById('drawer');
  if(drawer&&drawer.classList.contains('open')&&!e.target.closest('#drawer')&&!e.target.closest('#hamburger')){
    drawer.classList.remove('open');
    const ham=document.getElementById('hamburger');
    if(ham) ham.setAttribute('aria-expanded','false');
  }
  // Route navigation
  const link=e.target.closest('[data-route]');
  if(link){
    e.preventDefault();
    const drawer=document.getElementById('drawer');
    if(drawer) drawer.classList.remove('open');
    navigate(link.dataset.route);
  }
});

document.addEventListener('submit',function(e){
  if(e.target.id==='contact-form'){
    e.preventDefault();
    const form=document.getElementById('contact-form');
    const confirm=document.getElementById('form-confirm');
    if(form) form.style.display='none';
    if(confirm) confirm.style.display='block';
  }
});

window.addEventListener('popstate',function(){
  route=getRoute();
  renderSite();
  window.scrollTo({top:0,behavior:'instant'});
});

/* ── INIT ── */
route=getRoute();
renderSite();
</script>
